# 下面三个落点用来判定：VB4679 之后是 f_06021FB8 不再进来，还是 f_06021E18 的内层循环退出后不再继续。
[[hook]]
module = "TRUE"
at = 0x06021FB8

[[hook]]
module = "TRUE"
at = 0x06022014

[[hook]]
module = "TRUE"
at = 0x06021E3C

# 实测（evidence/p1-objchain-005）：f_06021FB8（场景运行器）整轮只进入 2 次
# （VB1254、VB2586），它调用的 f_06021E18 在 06022014 处返回的时刻是 VB1501 与 VB4683；
