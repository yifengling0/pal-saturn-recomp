# PAL-P1-009 第三次收窄（2026-10-10，证据见 docs/P1_RECOMP_REPORT.md §4.10）：
# --watch 05E00000:05E80000 的按写入者统计显示，停滞段里
#   TRUE:0602DC58（上一幕的逐帧背景搬移）1,013,760 次写、全部非零，但只到 VB4679；
#   PROG:060225A4 在 VB5200/5600 写 131,072 次**全零**（= 整屏 512KB 清零）；
#   PROG:060223C0 在 VB5100-5399 写 5,592 次非零（VRAM 0x20000-0x3FFFF，约 22KB 真数据），
#     随后就被 VB5600 的清零抹掉；VB5661 之后整轮再没有任何 VDP2 VRAM 写入。
# 所以问题从"背景数据从未写入"改成"写了，又被清掉，之后再没有第二次写"。
# 下面三个 hook 打在图形对象处理链的判定点上（都是 jsr 返回后的那条指令，符合落点要求）：
#   TRUE:060229B6 = f_0602BEDC（图形对象处理器，反汇编 p_true_000.cpp:4065）调用返回后；
#   TRUE:0602C28C = f_0602BEDC 内 `jsr @r1`(f_0602E55C) 返回后，紧接着是 `tst r9,r9`，
#                  r9==0 就直接跳到 0602C362 跳过整段上载（p_true_002.cpp:5021）；
#   TRUE:0602CCA0 = VRAM 写入者本身的入口（上一幕每帧都会进它；0602C326 那条是 bra，
#                  emit.py 不允许，所以改打入口）。
[[hook]]
module = "TRUE"
at = 0x060229B6

[[hook]]
module = "TRUE"
at = 0x0602C28C

[[hook]]
module = "TRUE"
at = 0x0602CCA0

# 实测（evidence/p1-objchain-001）：上面三个 hook 的命中全部止于 VB4679，之后一次都不再进来。
# 所以门在 f_0602296C（图形对象处理器的直接调用者，p_true_000.cpp:4031）之上或它的第一个分支上：
#   TRUE:06022240 = 每帧循环里 `jsr @r0`(f_0602296C) 返回后 —— 数 f_0602296C 到底还被不被调用；
#   TRUE:06022984 = f_0602296C 内 `jsr @r0`(f_0602BC60) 返回后，紧接着 `tst r8,r8`，
#                   r8!=0 就走 060229D4 而**不会**走到 060229B2 的处理器调用。
# 两者的命中差就能判定：是"上层不再调用"，还是"被 f_0602BC60 的返回值拦下"。
[[hook]]
module = "TRUE"
at = 0x06022240

[[hook]]
module = "TRUE"
at = 0x06022984

# 实测（evidence/p1-objchain-002）：06022984 与 060229B6 命中数完全相同（560 次，VB1286→4679），
# 说明 f_0602BC60 从不拦路，是 **f_0602296C 本身在 VB4679 之后不再被调用**；
# 而调用点 0602223C 只贡献 2 次，主力来自别的宿主函数。
# f_0602296C 的宿主层（p_true_000.cpp 行号→函数）：
#   06021EB8 在 f_06021E18 内；0602223C 与 060222B8 在 f_06022170 内；06022B58/06022B6C 在 f_06022AF4 内。
# 下面打这三个宿主函数的入口（函数入口是合法落点）+ 060222BC，一次跑完就能判定
# 是"哪个上层循环停了"，还是"循环还在但内部分支改道"。
[[hook]]
module = "TRUE"
at = 0x06021E18

[[hook]]
module = "TRUE"
at = 0x06022170

[[hook]]
module = "TRUE"
at = 0x06022AF4

[[hook]]
module = "TRUE"
at = 0x060222BC

# 实测（evidence/p1-objchain-003）：三个宿主函数入口加起来只有 06021E18=2、06022170=2、06022AF4=0，
# 而 06022984（f_0602296C 内部）命中 560 次 —— 说明 f_0602296C 几乎全是被**动态派发**（对象里的
# 处理函数指针，走 sh2_call）调进来的，静态字面量调用点只占 4 次。
# 所以打它自己的入口：hook 打印的 pr 就是那个真正遍历对象数组的循环的返回地址。
[[hook]]
module = "TRUE"
at = 0x0602296C

# 实测（evidence/p1-objchain-004）：560 次 f_0602296C 调用的 pr 全部是 06021EBC，
# 即来自 f_06021E18 内 06021EB8 的 `jsr @r0`；而 f_06021E18 入口整轮只进 2 次
