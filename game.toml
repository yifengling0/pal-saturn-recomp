# 实测（evidence/p1-sched-001）：调度器 f_06020E38 从 VB2574 进去后一直没返回；
# VB4686 走完第 6 幕分支（06020FE2），VB4707 由 PROG:060662D8 把 0x0601FA00 写成 8（下一幕号），
# VB4710 之后 6 个派发分支的返回点一次都没再命中。
# 读 f_06020E38 的状态机（p_true_000.cpp:1440-1472）看到确切的门：
#   06020EF0 r12 = f_060219D0(...)        —— 先取两个池句柄
#   06020EFA r11 = f_060219D0(r4=0x40, r5=0x18, r6=0)
#   06020F1C r0  = f_06021240(r4=r12, r5=r11, r6=0x40)
#   06020F22 cmp/gt r1=-1, r0 ；**r0 <= -1 就直接 bra 0602113A 跳过整段场景派发**，
#   只有 r0 > -1 才进 06020F2A：state = (0x0601FA00 - 1) 夹到 0..11，查 0x06020F4C 跳转表派发。
# 所以"第 8 幕永不启动"等价于"f_06021240 一直返回负数"。下面三个落点直接取这两个句柄和返回值。
[[hook]]
module = "TRUE"
at = 0x06020EF4

[[hook]]
module = "TRUE"
at = 0x06020EFE

[[hook]]
module = "TRUE"
at = 0x06020F20

