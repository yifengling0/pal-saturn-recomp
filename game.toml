# 2026-10-10 PAL-P1-006：PROG 在 06059C3A 用 `mov.l @r1,r1`（r1=06000344，BIOS 服务向量
# SYS_CHGSCUIM）取到 0000001E 并 FATAL。启动时 bios.cpp 把它写成 00001344，而整轮 --watch
# 06000344 只报出这一次写。所以在这个 hook 处直接把向量区打出来，判断是内存被改了还是读路径不对。
[[hook]]
module = "PROG"
at = 0x06059C34

# 每帧同步点（PROG 的主循环），用来按 VBlank 采样向量区 06000300..06000340，
# 找出 06000320/06000324/0600032C.. 被写成 0000001E / 25CAB3xx 的确切时刻。
[[hook]]
module = "PROG"
at = 0x0605D670

# PAL-P1-006 的写入者已用打了 0002 补丁后的 --watch 抓到：store 报的原始地址是 06100320/24、
# 0610032C/30、06100338/3C、06100344/48（=WRAM-H 的 1MiB 镜像别名，折叠后正是 0600 那张向量表），
# 值成对 {0000001E, 25CAB3xx}，宿主码归属 PROG:0605FD92、pr=0605FE56。反汇编（build/prog_full.asm
# 0605FD92..0605FF82）里这个函数唯一形状吻合的是 0605FE64 的循环：
#   0605FE56 mov.l [060663D8] 的地址->r3 ; 0605FE5A mov.l @r3,r3   ; r3 = 表基址
#   0605FE58 mov.l [06020088] 的地址->r1; 0605FE5C mov.l @r1,r1   ; r1 = 长度
#   0605FE5E mov #25C00060->r0 ; 0605FE60 add r3,r1               ; r1 = 结束地址
#   循环体 0605FE64 st32(r3+4,r0) ; 0605FE66 st32(r3,r2=30) ; r3+=12 ; cmp/ge r1,r3; bf/s
# 所以还差的实测量只有：本次的基址 r3 与结束地址 r1（即"表被铺到了 0610 这一镜像"还是"长度失控"）。
[[hook]]
module = "PROG"
at = 0x0605FE56

# 循环开始前一行：r3=基址、r1=基址+长度、r0=首个 25C0xxxx 指针。一次调用命中一次。
[[hook]]
module = "PROG"
at = 0x0605FE60

# 循环体首：逐条记录打印写入地址 r3（PAL_LIMIT 限制次数），确认写入序列的起点与步长。
[[hook]]
module = "PROG"
at = 0x0605FE64

# P0 的通用块拷贝例程（build/p0_full.asm 06007E90）：
#   r4=目标地址, r6=源地址, [r14+8]=字数, r5/r7=目标/源步长；06007FDE 是它的调用点回返地址，
#   --watch 06020088 报出的两次整块覆盖（VB11 写回 00004FF8/0001DFD0/00008000=PROG.BIN 原字节，
#   VB1227 写成 06040C40/060552A0/06020E38）都归到这里。hook 在序言之后打印参数，定位 VB1227
#   那次到底把什么拷到了哪里、拷了多少。
[[hook]]
module = "P0"
at = 0x06007E96

# 060041F6..06004204（build/p0_full.asm）：P0 主循环读 [0x0601FA00]，不等于 7 就
#   mov.l #0x06020000,r8 ; jsr @r8   —— 也就是**调用**换入的程序并等它返回。
# 06004206 是程序 rts 之后 P0 执行的下一条指令，hook 它就是"程序正常返回装载器"的证据
# （上游原本把调用模块基址一律当 program start 展开宿主栈，返回即 FATAL，见 patches/0003）。
[[hook]]
module = "P0"
at = 0x06004206

