# hook 只能落在 jsr 之后的那条指令上（emit.py 不允许把 hook 插在 jsr/延迟槽语句里）：
# 06004164 = 装载调用返回后，06004334 = 06004950 的状态写回后，06004364 = 06004EB0 的结果写回后。
[[hook]]
module = "P0"
at = 0x06004164

[[hook]]
module = "P0"
at = 0x06004334

[[hook]]
module = "P0"
at = 0x06004364

[[hook]]
module = "P0"
at = 0x06004950

[[hook]]
module = "P0"
at = 0x06004EB0

# 2026-10-10 追 PAL-P1-001 追加（反汇编见 evidence/p1-disasm-06004580.txt、p1-disasm-06004950.txt、
# p1-disasm-06004740.txt）：
#   060045CC = f_060045CC 入口，r4 即它等待的 CD Block HIRQ 位掩码（读 0x25890008 并与 0x06010F50
#              的历史值合并后比较）；返回 -1 = 位还没齐。
