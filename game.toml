# 2026-10-10 PAL-P1-009 落点收敛（§4.10 ⑨⑩ 之后）：--watch 06076B48:06076B4C 与
# build/run/oqueue.log 合起来说明：P0 的状态写入服务 P0:06010A80 在停滞幕**每帧都被调一次**
# （pr 0x06022EFA，即 f_06022D5C 里 0x06022EF6 那次调用），而 VB1173 写 1、VB2505 写 6 也出自同一个点。
# 所以差别只可能在入参 r4 上。这里把它的入口挂上，比对"改了状态的那两次"与"每帧这 71 次"的 r4/r5/r6。
# 判据：若每帧那批 r4 与改状态那两次不同，就去找 PROG 侧是谁在挑 r4；若相同，则门在 06010A80 内部。
[[hook]]
module = "P0"
at = 0x06010A80

