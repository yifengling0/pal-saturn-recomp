# game.toml — 《仙剑奇侠传》土星版 (T-37401H V1.000, areas JT, "LEGEND OF SWORD AND FAIRY")
#
# 本文件里的每个地址都来自这张盘实测，不是从别的游戏抄的：
#   base 0x06004000  = IP.BIN 声明的 1st read 装载地址（`saturnrecomp.disc --info`，见
#                      evidence/p0-disc-001/disc_info.txt）；`saturnrecomp.sh2 0 --find-base` 独立
#                      给出的首选候选同为 0x06004000（252 处序言命中）。
#   seed 0x06004040  = /0 自带引导桩的跳转目标（0x06004024 的字面量池 -> jmp @r4，
#                      反汇编见 evidence/p0-disc-001/disasm_0_head.txt）。
#   PROG.BIN 的 0x06020000 目前只是 find-base 候选（581 处序言命中），尚未由运行时装载行为证明，
#   因此这里先注释掉，等 learn 或 CD 读取日志证明后再启用。
[game]
name = "Legend of Sword and Fairy (Saturn, T-37401H V1.000)"
seeds = "tools/seeds.json"
build = "build"
cmake = ["SATURN_EXTRA=C:/Users/liufeng/Downloads/Palhero.net-pal-ss/PAL-Saturn-Recomp/src/pal_game/pal_game.cmake",
         "SDL3_DIR=C:/Users/liufeng/Downloads/Palhero.net-pal-ss/PAL-Saturn-Recomp/third_party/sdl3/SDL3-3.4.18/cmake"]

[[module]]
name = "P0"
file = "build/disc-extract/0"
base = 0x06004000
seeds = [0x06004040]

# 待运行时证明后启用：
# [[module]]
# name = "PROG"
# file = "build/disc-extract/PROG.BIN"
# base = 0x06020000
# seeds = [0x06020040]

# 2026-10-10 实测启用（evidence/p1-boot-002.log）：
#   [13.730 FATAL] call to 06020040, not an entry of an active module (from pr 06004180)
#   r6 06020000  r8 06020040
# /0 在装载 PROG.BIN 之后直接跳进 0x06020040，因此 base 与入口都由运行行为证明，
# 不再是 --find-base 的启发式候选。
[[module]]
name = "PROG"
file = "build/disc-extract/PROG.BIN"
base = 0x06020000
seeds = [0x06020040]

# 2026-10-10 PAL-P1-006 的实测结论：游戏在 VBlank 1227 把 0x06020000 处的 PROG.BIN **换入成
# TRUE.BIN**（同址覆盖装载），而 game.toml 里只有 PROG，运行时就继续跑 PROG 的本机码。
# 证据链（全部本机实测，见 evidence/p1-true-*.log）：
#   1) --watch 06020088:06020090 打到 0002 补丁后报出两次整块覆盖，写入者 P0:06007E90（pr 06007FDE）：
#        VB11   -> 00004FF8 / 0001DFD0 / 00008000   (=PROG.BIN 文件同址字节)
#        VB1227 -> 06040C40 / 060552A0 / 06020E38   (=TRUE.BIN 文件同址字节)
#   2) hook 06007E96 打印的装载请求块 [r9=0601875C]：+00=06020000 目标、+04=00021000 长度、
#      +08=已搬运进度、+18=00000042(=66) 扇区数；每块 0x800 字节，源 = CD 缓冲区 0x25818000。
#      66 扇区 = 135,168 字节，盘上唯一落在 (65,66] 扇区的文件是 TRUE.BIN(134,200 字节)。
#   3) TRUE.BIN 与 PROG.BIN 的引导桩逐指令相同，只是字面量池不同：
#        [0x1C] 数据指针 0x06039520（PROG 为 0x060663D0）、[0x24] 入口 0x06020058（PROG 为 0x06020040）。
#      入口取自镜像自身头部，和 PROG 的 0x06020040 同源，因此 seed 由镜像证明而非猜测。
# 后果（已验证）：PROG 的 0605FD92 把换入镜像头部的 0x06040C40 当成自己那张 {30,指针} 表的长度，
#   从 060C0000 起连铺 2 万+ 条记录，铺过 WRAM 尾（060FFFFF）后按 1MiB 镜像落到 0x06100320，
#   折叠进 BIOS 服务向量 0x06000320..0x0600034C，于是 06059C3A 的 `jsr @r1` 取到 0x1E 而 FATAL。
[[module]]
name = "TRUE"
file = "build/disc-extract/TRUE.BIN"
base = 0x06020000
seeds = [0x06020058]


# 诊断 hook（游戏层 src/pal_game/pal_diag.cpp 用 PAL_HOOKS 选择启用哪些）：
