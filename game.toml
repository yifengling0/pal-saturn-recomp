#   060042E4 = 060042E0 `jsr @r8` 返回后，r0 = 装载包装函数的返回值。
[[hook]]
module = "P0"
at = 0x060045CC

[[hook]]
module = "P0"
at = 0x060045AE

[[hook]]
module = "P0"
at = 0x06004758

[[hook]]
module = "P0"
at = 0x060047B8

[[hook]]
module = "P0"
at = 0x060042E4

