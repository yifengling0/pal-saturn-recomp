plugins { id 'com.android.application' }
android {
    namespace 'org.palsaturn.android'
    compileSdk 35
    defaultConfig {
        applicationId 'org.palsaturn.android'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.1.0-preview.7-android.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        java.srcDirs += project.property('sdlJava')
        jniLibs.srcDirs = [project.property('nativeLibs')]
    }
    buildTypes { debug { debuggable true } }
}
